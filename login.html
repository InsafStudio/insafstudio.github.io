<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Инсаф Студио</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/BKTj140N/image.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/BKTj140N/image.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080c;
            --text-color: #f3f4f6;
            --card-bg: rgba(22, 22, 33, 0.7);
            --card-border: rgba(255, 255, 255, 0.06);
            --card-text-muted: #9ca3af;
            --accent-color: #ff0055;
            --glow-effect: 0 0 20px rgba(255, 0, 85, 0.35);
            --glass-blur: blur(12px);
            --site-font: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            --border-radius-base: 16px;
        }

        /* --- КЛАССИЧЕСКАЯ ТЕМА --- */
        body.classic-theme {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --card-bg: #1c1c1c;
            --card-border: #2b2b2b;
            --card-text-muted: #aaaaaa;
            --border-radius-base: 12px;
            background-image: none !important;
        }
        body.classic-theme .login-card {
            backdrop-filter: none !important;
            border: 2px solid var(--card-border);
        }

        body.light-theme {
            --bg-color: #f4f6fa;
            --text-color: #111827;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.1);
            --card-text-muted: #4b5563;
        }
        body.minecraft-theme {
            --bg-color: #4a3b2c;
            --text-color: #ffff55;
            --card-bg: #2a1e12;
            --card-border: #140e08;
            --card-text-muted: #aaaaaa;
            --site-font: 'Press Start 2P', monospace;
            --border-radius-base: 0px;
        }

        body.minecraft-theme * {
            font-family: var(--site-font) !important;
            letter-spacing: -0.5px;
        }
        body.minecraft-theme h2 { font-size: 12px !important; text-shadow: 2px 2px #000; }
        body.minecraft-theme .input-field, 
        body.minecraft-theme .btn, 
        body.minecraft-theme .google-btn { font-size: 8px !important; padding: 10px !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--site-font); }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background-image: radial-gradient(circle at 80% 20%, rgba(255, 0, 85, 0.05) 0%, transparent 40%), radial-gradient(circle at 10% 70%, rgba(122, 0, 255, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius-base);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
        }

        .logo-area {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            text-decoration: none;
        }
        .logo-area img {
            height: 42px;
            border-radius: 10px;
            box-shadow: var(--glow-effect);
        }
        .logo-area span {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-color), #9d00ff);
            padding: 4px 10px;
            border-radius: 8px;
            box-shadow: var(--glow-effect);
        }

        h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .forgot-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s;
        }
        body.light-theme .input-field { background: #fff; color: #111827; }
        .input-field:focus {
            border-color: var(--accent-color);
            background: rgba(0,0,0,0.3);
            box-shadow: 0 0 12px rgba(255,0,85,0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-color), #bc003f);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.25s;
            box-shadow: var(--glow-effect);
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 25px var(--accent-color);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--card-text-muted);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid var(--card-border);
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }
        body.light-theme .google-btn { color: #111827; background: rgba(0,0,0,0.03); }
        .google-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--text-color);
        }
        .google-btn img {
            width: 18px;
            height: 18px;
        }

        .switch-auth {
            margin-top: 20px;
            font-size: 13px;
            color: var(--card-text-muted);
        }
        .switch-auth a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }
        .switch-auth a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="index.html" class="logo-area">
            <img src="https://i.ibb.co/BKTj140N/image.png" alt="Инсаф Студио">
            <span>Назад</span>
        </a>

        <h2 id="auth-title">Вход в аккаунт</h2>

        <form id="auth-form" onsubmit="return false;">
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" class="input-field" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="password">
                    Пароль 
                    <a href="#" class="forgot-link" id="forgot-password-link" onclick="window.resetPassword()">Забыли пароль?</a>
                </label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" id="submit-btn">Войти</button>
        </form>

        <div class="divider">или</div>

        <button class="google-btn" id="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Войти через Google
        </button>

        <div class="switch-auth" id="switch-box">
            Нет аккаунта? <a href="#" id="switch-link" onclick="window.toggleAuthMode(true)">Зарегистрироваться</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBkz-l4lX57yRvGiZsQ3PV53p0vMg_hJrQ",
          authDomain: "insaf-backend.firebaseapp.com",
          projectId: "insaf-backend",
          storageBucket: "insaf-backend.firebasestorage.app",
          messagingSenderId: "767081007202",
          appId: "1:767081007202:web:f511d4fd8f20b9af87e93b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRegisterMode = false;

        document.body.classList.remove('light-theme', 'dark-theme', 'minecraft-theme', 'classic-theme');
        const theme = localStorage.getItem('siteTheme') || 'dark';
        if(theme !== 'dark') document.body.classList.add(theme + '-theme');

        const accentColor = localStorage.getItem('accentColor') || '#ff0055';
        document.documentElement.style.setProperty('--accent-color', accentColor);
        document.documentElement.style.setProperty('--glow-effect', '0 0 20px ' + accentColor + '59');

        window.toggleAuthMode = function(toRegister) {
            isRegisterMode = toRegister;
            const title = document.getElementById('auth-title');
            const submitBtn = document.getElementById('submit-btn');
            const switchBox = document.getElementById('switch-box');
            const forgotLink = document.getElementById('forgot-password-link');

            if(isRegisterMode) {
                title.innerText = "Регистрация";
                submitBtn.innerText = "Создать аккаунт";
                switchBox.innerHTML = `Уже есть аккаунт? <a href="#" onclick="window.toggleAuthMode(false)">Войти</a>`;
                if(forgotLink) forgotLink.style.display = 'none';
            } else {
                title.innerText = "Вход в аккаунт";
                submitBtn.innerText = "Войти";
                switchBox.innerHTML = `Нет аккаунта? <a href="#" onclick="window.toggleAuthMode(true)">Зарегистрироваться</a>`;
                if(forgotLink) forgotLink.style.display = 'inline';
            }
        };

        window.resetPassword = async function() {
            const emailInput = document.getElementById('email');
            let email = emailInput.value.trim();

            if (!email) {
                email = prompt("Введите ваш Email для сброса пароля:");
            }

            if (!email) return;

            try {
                await sendPasswordResetEmail(auth, email);
                alert("Ссылка для сброса пароля отправлена на почту: " + email);
            } catch (error) {
                alert("Ошибка при отправке письма: " + error.message);
            }
        };

        document.getElementById('auth-form').addEventListener('submit', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if(isRegisterMode) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", userCredential.user.uid), {
                        nickname: email.split('@')[0],
                        avatar: "https://via.placeholder.com/40"
                    });
                    alert("Регистрация успешна!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                window.location.href = 'index.html';
            } catch (error) {
                alert("Ошибка: " + error.message);
            }
        });

        document.getElementById('google-btn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                
                if (!userDoc.exists()) {
                    await setDoc(userDocRef, {
                        nickname: user.displayName || "Пользователь",
                        avatar: user.photoURL || "https://via.placeholder.com/40"
                    });
                }

                window.location.href = 'index.html';
            } catch (error) {
                alert("Ошибка входа через Google: " + error.message);
            }
        });
    </script>
</body>
</html>
